services:
  - type: web
    name: saurabh-portfolio-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL
        value: openrouter/free
      - key: ALLOWED_ORIGIN
        value: https://manishchavan55.github.io
